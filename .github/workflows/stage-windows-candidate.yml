name: Stage reviewed Windows candidate privately
on:
  push:
    branches: [release-candidate]
    paths: ['.github/workflows/stage-windows-candidate.yml']
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify and attach to the existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=nikolaivintenJohansen/virillio-code-releases
          test "$(gh release view v0.1.4-candidate --repo "$repo" --json isDraft --jq .isDraft)" = true
          gh run download 36294237715 --repo "$repo" --name windows-014-candidate --dir output
          cd output/dist
          echo 'db0bfbe52e9e947eed3f87bf95e4dc37d9f38adeb90bfcd00e936f864502aa36  Virillio-Code-0.1.4-x64-Setup.exe' | sha256sum -c
          mv Virillio-Code-0.1.4-x64-Setup.exe Virillio-Code-0.1.4-x64-r9-Setup.exe
          gh release upload v0.1.4-candidate Virillio-Code-0.1.4-x64-r9-Setup.exe --repo "$repo"
