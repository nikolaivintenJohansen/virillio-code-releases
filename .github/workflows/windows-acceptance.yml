name: Windows installer acceptance
on:
  push:
    branches: [windows-acceptance]
    paths: ['.github/workflows/windows-acceptance.yml', '.github/windows-acceptance/**']
permissions:
  contents: read
concurrency:
  group: windows-installer-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, legacy]
    # GitHub requires push permission to see draft releases. The token is passed
    # only to the download step and is removed before application execution.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the exact unpublished installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'virillio-acceptance'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          gh release download v0.1.3-windows-beta.3 --repo nikolaivintenJohansen/virillio-code-releases --pattern Virillio-Code-0.1.3-x64-Setup.exe --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $hash = (Get-FileHash -LiteralPath (Join-Path $destination 'Virillio-Code-0.1.3-x64-Setup.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8d990f1cc879e77499312d702a69b8e40be39def0b3b68caaa5ec806f19c38f0') { throw 'Candidate checksum mismatch' }
      - name: Exercise real installers and applications
        shell: pwsh
        env:
          VIRILLIO_ACCEPTANCE_SCENARIO: ${{ matrix.scenario }}
        run: python .github/windows-acceptance/coexistence.py
      - name: Retain test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-coexistence-evidence-${{ matrix.scenario }}
          path: ${{ runner.temp }}/virillio-acceptance/evidence/
          if-no-files-found: warn
          retention-days: 7
