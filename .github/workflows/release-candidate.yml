name: Build unpublished Virillio 0.1.4 candidates
on:
  push:
    branches: [release-candidate]
    paths: ['.github/workflows/release-candidate.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 70
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download frozen private source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.4-candidate --repo nikolaivintenJohansen/virillio-code-releases --pattern source-0.1.4-r5.tar.gz
          if ($LASTEXITCODE) { throw 'Source download failed' }
          if ((Get-FileHash source-0.1.4-r5.tar.gz).Hash.ToLowerInvariant() -ne '9d142d600208a13f385c313fb2d92adcfeb5015ec68445f17bbd70e9764c3ff7') { throw 'Source hash mismatch' }
          tar -xzf source-0.1.4-r5.tar.gz
          if ($LASTEXITCODE) { throw 'Source extraction failed' }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned memory-runtime build tool
        run: python -m pip install uv==0.12.10
      - uses: actions/download-artifact@v4
        with:
          name: wsl-x64
          run-id: 36286707024
          github-token: ${{ github.token }}
          path: .wsl/x64
      - uses: actions/download-artifact@v4
        with:
          name: wsl-arm64
          run-id: 36286707024
          github-token: ${{ github.token }}
          path: .wsl/arm64
      - run: bun install --frozen-lockfile
      - name: Build and test native candidate
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: 1.18.21
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_ACTIONS = 'false'
          $env:BUN_INSTALL_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'verified-bun-cache'
          @'
          import os,json,urllib.request,hashlib,base64,tarfile,io
          from pathlib import Path
          meta=json.load(urllib.request.urlopen('https://registry.npmjs.org/@oven/bun-windows-x64-baseline/1.3.14'))
          data=urllib.request.urlopen(meta['dist']['tarball']).read()
          assert meta['dist']['integrity']=='sha512-'+base64.b64encode(hashlib.sha512(data).digest()).decode()
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              binary=archive.extractfile('package/bin/bun.exe').read()
          target=Path(os.environ['BUN_INSTALL_CACHE_DIR'])/'bun-windows-x64-baseline-v1.3.14'
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(binary)
          print(json.dumps({'baselineBinarySHA256':hashlib.sha256(binary).hexdigest(),'npmIntegrity':meta['dist']['integrity']}))
          '@ | python
          if ($LASTEXITCODE) { throw 'Verified Bun baseline preparation failed' }
          Push-Location packages/cli
          bun script/build.ts --single --baseline --skip-install
          if ($LASTEXITCODE) { throw 'Service CLI failed' }
          Pop-Location
          $env:OPENCODE_DESKTOP_CLI_PATH = Join-Path $pwd 'packages/cli/dist/cli-windows-x64-baseline/bin/lildax.exe'
          Push-Location packages/opencode
          bun script/build.ts --single --baseline --skip-install --skip-embed-web-ui
          if ($LASTEXITCODE) { throw 'Terminal CLI failed' }
          Pop-Location
          New-Item -ItemType Directory -Force packages/opencode/dist/opencode-linux-x64-baseline/bin, packages/opencode/dist/opencode-linux-arm64/bin | Out-Null
          Copy-Item .wsl/x64/opencode packages/opencode/dist/opencode-linux-x64-baseline/bin/opencode
          Copy-Item .wsl/arm64/opencode packages/opencode/dist/opencode-linux-arm64/bin/opencode
          Push-Location packages/desktop
          bun typecheck
          if ($LASTEXITCODE) { throw 'Typecheck failed' }
          # Windows PowerShell children must not inherit PowerShell Core modules.
          $env:PSModulePath = "$env:WINDIR\System32\WindowsPowerShell\v1.0\Modules;$env:ProgramFiles\WindowsPowerShell\Modules"
          powershell.exe -NoProfile -NonInteractive -Command "Get-Command Get-FileHash | Select-Object Name, Source"
          if ($LASTEXITCODE) { throw 'Windows PowerShell module path is invalid' }
          bun test src/main/account-controller.test.ts src/main/account-storage.test.ts scripts/windows-installer.test.ts scripts/installer-guard.test.ts
          if ($LASTEXITCODE) { throw 'Desktop tests failed' }
          bun run package:win:release
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          Get-ChildItem dist/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-014-candidate
          retention-days: 14
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.txt
            packages/desktop/dist/*.yml
            packages/desktop/resources/windows/generated/*.json
